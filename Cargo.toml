[package]
name = "depaudit"
version = "0.1.0"
edition = "2021"
description = "Checks Cargo.lock, package-lock.json, yarn.lock, pnpm-lock.yaml, requirements.txt, go.sum, and Gemfile.lock against OSV.dev for known vulnerabilities, in one pass"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/depaudit"
readme = "README.md"
keywords = ["security", "vulnerability", "audit", "osv", "dependencies"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "depaudit"
path = "src/lib.rs"

[[bin]]
name = "depaudit"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.8"
serde_yaml = "0.9"
